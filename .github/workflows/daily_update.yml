name: Daily Finance Note and Sunday Macro

on:
  schedule:
    # 週一至週六台北時間 05:09（UTC 週日到週五 21:09）：每日一則重大財經新聞。
    - cron: '9 21 * * 0-5'
    # 星期日台北時間 05:09（UTC 週六 21:09）：完整總經週報取代每日新聞。
    - cron: '9 21 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python finance_news_agent.py

      - name: Publish Xiaozhen narration MP3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          narration_files=(data/audio/*.mp3)
          if [ ${#narration_files[@]} -eq 0 ]; then
            echo "No narration file was generated; publishing the written report only."
            exit 0
          fi
          gh release view xiaozhen-narration >/dev/null 2>&1 || \
            gh release create xiaozhen-narration \
              --title "曉臻導讀音檔" \
              --notes "每日重大財經新聞與週日長線總經的完整語音導讀。"
          gh release upload xiaozhen-narration "${narration_files[@]}" --clobber

      - name: Commit & push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily finance note or Sunday macro"
