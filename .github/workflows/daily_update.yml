name: Weekly Macro Update

on:
  schedule:
    # 每週一台北時間 05:09（週日 UTC 21:09）。
    # 經濟資料多為週／月頻；週更可避免用日線雜訊製造結論。
    - cron: '9 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python finance_news_agent.py

      - name: Commit & push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily finance update"
